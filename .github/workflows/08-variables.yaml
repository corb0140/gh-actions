name: 08 - Using Variables

on:
  push:
  workflow_dispatch:

env:
  WORKFLOW_VAR: "This is a workflow env var"
  OVERWRITTEN: "This will be overwritten"
  UNDEFINED_VAR_WITH_DEFAULT: ${{vars.UNDEFINED_VAR || 'default_value'}}

jobs:
  echo:
    runs-on: ubuntu-latest
    env:
      JOB_VAR: "This is a job env var"
      OVERWRITTEN: "This job has been overwritten at the job level"
    steps:
      - name: Print Env Variables
        env:
          STEP_VAR: "This is a step env var"
          step_var2: "This is another step env var"
        run: |
          echo "Step env var: ${{env.STEP_VAR}}"
          echo "Step env var2: $step_var2"
          echo "Job env var: ${{env.JOB_VAR}}"
          echo "Workflow env var: ${{env.WORKFLOW_VAR}}"
          echo "Overwritten env var: ${{env.OVERWRITTEN}}"
      - name: Overwrite job variable
        env:
          OVERWRITTEN: "This has been overwritten at the step level"
        run: |
          echo "Step env var: ${{env.OVERWRITTEN}}"
  echo2:
    runs-on: ubuntu-latest
    steps:
      - name: Print Variables
        run: |
          echo: "Repo var: ${{vars.REPOSITORY_VAR}}"
  echo-prod:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Print Prod Variables
        run: |
          echo "Environmetn var: ${{vars.TARGET_VAR}}"
  echo-undefined:
    runs-on: ubuntu-latest
    steps:
      - name: Print Undefined Variables
        run: |
          echo "Undefined var: ${{env.UNDEFINED_VAR_WITH_DEFAULT}}"
