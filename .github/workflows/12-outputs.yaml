name: 12 - Working with Outputs

on:
  workflow_dispatch:
    inputs:
      build-status:
        type: choice
        options:
          - success
          - failure
        default: success

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      output-build-status: ${{ steps.build.outputs.status }}
    steps:
      - name: Build
        id: build
        run: echo "status=${{ inputs.build-status }}" >> $GITHUB_OUTPUT
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        if: ${{needs.build.outputs.output-build-status == 'success'}}
        run: echo "Deploying"
