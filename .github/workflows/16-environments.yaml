name: 16 - Workflow with Environments

on:
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Echo vars
        run: |
          echo "Deploying to staging environment..."
  e2e-tests:
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: Run e2e tests
        run: |
          echo "Running e2e tests..."
  deploy-prod-frontend:
    runs-on: ubuntu-latest
    needs: e2e-tests
    environment: prod
    steps:
      - name: Echo vars
        run: |
          echo "Deploying prod frontend"
  deploy-prod-backend-1:
    runs-on: ubuntu-latest
    needs: e2e-tests
    environment: prod
    steps:
      - name: Echo vars
        run: |
          echo "Deploying prod backend 1"
  deploy-prod-backend-2:
    runs-on: ubuntu-latest
    needs: e2e-tests
    environment: prod
    steps:
      - name: Echo vars
        run: |
          echo "Deploying prod backend 2"
