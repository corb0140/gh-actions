name: Update NPM Dependencies
description: Check if there are updates to NPM packages, and creates a PR with the updates packages-json files.


inputs:
  base-branch:
    description: The branch used as the base for the dependency update checks
    default: main
    required: true
  target-branch:
    description: The branch from which the PR is created
    default: update-dependencies
    required: false
  working-directory:
    description: The working directory of the project to check for dependency updates
    required: true
  gh-token:
    description: Authentication token with repository access. Must gave write access to contents and pull-requests
    required: true
  debug:
    description: Whether the output debug messages to the console
    default: 'false'

runs:
  using: node24
  main: index.js